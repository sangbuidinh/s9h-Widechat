<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wide Chat Toggle</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <h1>Wide Chat</h1>
    <form id="widechat-form">
      <label for="chatgpt-toggle">
        <input type="checkbox" id="chatgpt-toggle" name="chatgpt">
        <span>Enable on ChatGPT</span>
      </label>
      <label for="gemini-toggle">
        <input type="checkbox" id="gemini-toggle" name="gemini">
        <span>Enable on Gemini</span>
      </label>
    </form>
  </div>
  <script src="popup.js"></script>
</body>

</html>
